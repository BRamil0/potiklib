[project]
name = "potiklib"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Qulowg", email = "qulowg@gmail.com" }
]
requires-python = ">=3.15"
dependencies = []

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.15",
]

[project.scripts]
potiklib = "potiklib:main"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "ty",
]

[project.urls]
Homepage = "https://github.com/BRamil0/potiklib"
Issues = "https://github.com/BRamil0/potiklib/issues"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py315"

[tool.ruff.lint]
select = ["E", "F", "I"]
fixable = ["I"]