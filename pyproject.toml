[project]
name = "potiklib"
version = "1.0.0"
description = "Zero-dependency parallel execution library for free-threaded Python 3.15+ and asyncio"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.txt"]
authors = [
    { name = "Qulowg", email = "qulowg@gmail.com" }
]
requires-python = ">=3.15"
dependencies = []

classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.15",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

[project.scripts]
potiklib = "potiklib:main"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "ty",
]

[project.urls]
Homepage = "https://github.com/BRamil0/potiklib"
Issues = "https://github.com/BRamil0/potiklib/issues"

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py315"

[tool.ruff.lint]
select = ["E", "F", "I"]
fixable = ["I"]

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"